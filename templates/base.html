<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ExaVault - Secret & .env Manager{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#09090b',
                            900: '#121215',
                            850: '#18181b',
                            800: '#27272a',
                            750: '#323238',
                            700: '#3f3f46',
                        },
                        brand: {
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js for lightweight reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121215; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
    <script>
        // Global notification & confirmation helpers
        window.toast = function(msg, type = 'info', title = '') {
            window.dispatchEvent(new CustomEvent('toast', {
                detail: { msg, type, title }
            }));
        };

        window.askConfirm = function({ title, message, confirmText = 'Confirm', cancelText = 'Cancel', isDanger = true }) {
            return new Promise((resolve) => {
                window.dispatchEvent(new CustomEvent('open-confirm-dialog', {
                    detail: { title, message, confirmText, cancelText, isDanger, resolve }
                }));
            });
        };
    </script>
</head>
<body class="bg-dark-950 text-zinc-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

    {% block content %}{% endblock %}

    <!-- Modern Accessible Toast Notifications Stack -->
    <div x-data="{
            toasts: [],
            addToast(e) {
                const id = Date.now() + Math.random().toString(36).substring(2, 6);
                const toast = {
                    id,
                    msg: e.detail.msg || '',
                    title: e.detail.title || '',
                    type: e.detail.type || 'info',
                    timer: null
                };
                this.toasts.push(toast);
                const duration = e.detail.duration || (toast.type === 'error' ? 5000 : 3500);
                toast.timer = setTimeout(() => this.removeToast(id), duration);
            },
            removeToast(id) {
                const idx = this.toasts.findIndex(t => t.id === id);
                if (idx !== -1) {
                    clearTimeout(this.toasts[idx].timer);
                    this.toasts.splice(idx, 1);
                }
            }
         }"
         @toast.window="addToast($event)"
         aria-live="polite"
         role="status"
         class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
        <template x-for="t in toasts" :key="t.id">
            <div class="pointer-events-auto bg-dark-900/95 backdrop-blur-md border rounded-xl p-3.5 shadow-2xl flex items-start gap-3 transition-all duration-300 transform translate-y-0"
                 :class="{
                     'border-emerald-500/40 text-emerald-300 shadow-emerald-500/10': t.type === 'success',
                     'border-rose-500/40 text-rose-300 shadow-rose-500/10': t.type === 'error',
                     'border-amber-500/40 text-amber-300 shadow-amber-500/10': t.type === 'warning',
                     'border-brand-500/40 text-brand-300 shadow-brand-500/10': t.type === 'info'
                 }">
                <!-- Icon -->
                <div class="shrink-0 mt-0.5">
                    <template x-if="t.type === 'success'">
                        <span class="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xs font-bold">✓</span>
                    </template>
                    <template x-if="t.type === 'error'">
                        <span class="w-5 h-5 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center text-xs font-bold">✕</span>
                    </template>
                    <template x-if="t.type === 'warning'">
                        <span class="w-5 h-5 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center text-xs font-bold">!</span>
                    </template>
                    <template x-if="t.type === 'info'">
                        <span class="w-5 h-5 rounded-full bg-brand-500/20 text-brand-400 flex items-center justify-center text-xs font-bold">ℹ</span>
                    </template>
                </div>

                <!-- Content -->
                <div class="flex-1 text-xs">
                    <template x-if="t.title">
                        <p class="font-semibold text-white mb-0.5" x-text="t.title"></p>
                    </template>
                    <p class="text-zinc-200 leading-relaxed font-sans" x-text="t.msg"></p>
                </div>

                <!-- Close Button -->
                <button @click="removeToast(t.id)" class="text-zinc-400 hover:text-white shrink-0 p-0.5 text-xs rounded hover:bg-white/10 transition-colors" title="Close notification">
                    ✕
                </button>
            </div>
        </template>
    </div>

    <!-- Global Accessible Confirmation Modal (Replaces native browser confirm/alert) -->
    <div x-data="{
            isOpen: false,
            title: '',
            message: '',
            confirmText: 'Confirm',
            cancelText: 'Cancel',
            isDanger: true,
            resolve: null,
            openDialog(e) {
                this.title = e.detail.title || 'Confirm Action';
                this.message = e.detail.message || 'Are you sure you want to proceed?';
                this.confirmText = e.detail.confirmText || 'Confirm';
                this.cancelText = e.detail.cancelText || 'Cancel';
                this.isDanger = e.detail.isDanger !== false;
                this.resolve = e.detail.resolve;
                this.isOpen = true;
            },
            handleConfirm() {
                this.isOpen = false;
                if (this.resolve) this.resolve(true);
            },
            handleCancel() {
                this.isOpen = false;
                if (this.resolve) this.resolve(false);
            }
         }"
         @open-confirm-dialog.window="openDialog($event)"
         @keydown.escape.window="if (isOpen) handleCancel()"
         x-cloak>
        
        <div x-show="isOpen"
             class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm transition-opacity"
             x-transition:enter="ease-out duration-200"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="ease-in duration-150"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0">
            
            <div @click.away="handleCancel()"
                 class="bg-dark-900 border border-dark-800 rounded-2xl w-full max-w-md p-6 shadow-2xl flex flex-col gap-4 transform transition-all"
                 x-transition:enter="ease-out duration-200"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="ease-in duration-150"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 role="dialog"
                 aria-modal="true">
                
                <div class="flex items-start gap-3.5">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
                         :class="isDanger ? 'bg-rose-500/10 border border-rose-500/20 text-rose-400' : 'bg-brand-500/10 border border-brand-500/20 text-brand-400'">
                        <span class="text-lg" x-text="isDanger ? '⚠️' : '❓'"></span>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-white text-base tracking-tight" x-text="title"></h3>
                        <p class="text-xs text-zinc-400 mt-1.5 leading-relaxed" x-text="message"></p>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-dark-800">
                    <button type="button" @click="handleCancel()"
                            class="px-4 py-2 rounded-lg text-xs font-medium text-zinc-300 hover:text-white bg-dark-850 hover:bg-dark-800 border border-dark-800 transition-colors"
                            x-text="cancelText">
                    </button>
                    <button type="button" @click="handleConfirm()"
                            class="px-4 py-2 rounded-lg text-xs font-semibold text-white transition-all shadow-lg"
                            :class="isDanger ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-600/20' : 'bg-brand-500 hover:bg-brand-600 shadow-brand-500/20'"
                            x-text="confirmText">
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
