{% extends "base.html" %}

{% block title %}Login - ExaVault{% endblock %}

{% block content %}
<div class="flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md bg-dark-900 border border-dark-800 rounded-2xl p-8 shadow-2xl"
         x-data="{
             username: '',
             password: '',
             loading: false,
             error: '',
             async login() {
                 this.loading = true;
                 this.error = '';
                 try {
                     const res = await fetch('/api/auth/login', {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify({ username: this.username, password: this.password })
                     });
                     const data = await res.json();
                     if (!res.ok) {
                         throw new Error(data.message || 'Login failed');
                     }
                     window.location.href = '/dashboard';
                 } catch (err) {
                     this.error = err.message;
                 } finally {
                     this.loading = false;
                 }
             }
         }">
        
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 rounded-xl bg-brand-500/10 border border-brand-500/30 flex items-center justify-center text-brand-500 font-bold text-xl">
                ⚡
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">ExaVault</h1>
                <p class="text-xs text-zinc-400">Self-hosted Secret & .env Management</p>
            </div>
        </div>

        <template x-if="error">
            <div class="mb-5 p-3 rounded-lg bg-rose-950/60 border border-rose-800/80 text-rose-300 text-xs flex items-center gap-2">
                <span>⚠️</span>
                <span x-text="error"></span>
            </div>
        </template>

        <form @submit.prevent="login" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-zinc-300 mb-1.5">Username</label>
                <input type="text" x-model="username" required autofocus
                       class="w-full bg-dark-850 border border-dark-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-brand-500 transition-colors"
                       placeholder="Admin username">
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-300 mb-1.5">Password</label>
                <input type="password" x-model="password" required
                       class="w-full bg-dark-850 border border-dark-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-brand-500 transition-colors"
                       placeholder="••••••••••••">
            </div>

            <button type="submit" :disabled="loading"
                    class="w-full mt-2 bg-brand-500 hover:bg-brand-600 active:bg-brand-700 disabled:opacity-50 text-white font-medium text-sm py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-brand-500/20">
                <span x-show="!loading">Sign In</span>
                <span x-show="loading" class="animate-spin text-base">⏳</span>
            </button>
        </form>

        <div class="mt-8 pt-4 border-t border-dark-800 text-center">
            <p class="text-xs text-zinc-500">AES-256-GCM Encrypted at Rest • Zero Telemetry</p>
        </div>
    </div>
</div>
{% endblock %}
