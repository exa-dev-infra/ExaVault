apiVersion: v1
kind: Secret
metadata:
  name: exavault-env
  namespace: exavault
type: Opaque
stringData:
  APP_NAME: "exavault"
  ENVIRONMENT: "production"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  LOG_LEVEL: "info"

  # PostgreSQL Database Connection
  DATABASE_URL: "postgresql://postgres:password@postgres-service:5432/exavault?sslmode=disable"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_PASSWORD: "password"
  DB_NAME: "exavault"
  DB_SSLMODE: "disable"

  # AES-256-GCM Master Key (Must be 32 bytes or 64 hex characters)
  EXAVAULT_MASTER_KEY: "change_me_to_a_secure_32_byte_master_key_here"

  # Admin Dashboard Credentials
  ADMIN_USERNAME: "admin"
  ADMIN_PASSWORD: "change_me_admin_secure_password"

  # JWT & Session Secrets
  JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production"
  JWT_REFRESH_SECRET: "your-super-secret-jwt-refresh-key-change-this-in-production"
  ACCESS_TOKEN_EXPIRY_MINUTES: "15"
  REFRESH_TOKEN_EXPIRY_DAYS: "7"
  JWT_ISSUER: "exavault"
  COOKIE_SECURE: "true"

  # Public Application URL
  APP_URL: "https://exavault.eka-dev.cloud"

  # Feature Flags
  REDIS_ENABLED: "false"
  RABBITMQ_ENABLED: "false"
  IDEMPOTENCY_ENABLED: "true"
  IDEMPOTENCY_LIFETIME_HOURS: "24"
  IDEMPOTENCY_LOCK_TIMEOUT_SECONDS: "30"
  REALTIME_SSE_ENABLED: "true"
  REALTIME_WS_ENABLED: "false"
  REALTIME_BRIDGE: "local"
  OTEL_ENABLED: "false"
