{% extends "base.html" %}

{% block title %}Login - ExaVault{% endblock %}

{% block content %}
<div class="flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md bg-dark-900 border border-dark-800 rounded-2xl p-8 shadow-2xl"
         x-data="{
             username: '',
             password: '',
             loading: false,
             error: '',
             async login() {
                 this.loading = true;
                 this.error = '';
                 try {
                     const res = await fetch('/api/auth/login', {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify({ username: this.username, password: this.password })
                     });
                     const data = await res.json();
                     if (!res.ok) {
                         throw new Error(data.message || 'Login failed');
                     }
                     window.location.href = '/dashboard';
                 } catch (err) {
                     this.error = err.message;
                 } finally {
                     this.loading = false;
                 }
             }
         }">
        
        <div class="flex items-center gap-3.5 mb-8">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-brand-500/20 to-blue-500/10 border border-brand-500/30 flex items-center justify-center p-1.5 shadow-lg shadow-brand-500/10">
                <svg class="w-full h-full drop-shadow" viewBox="0 0 200 200" fill="none">
                    <defs>
                        <linearGradient id="login-top" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#a855f7" />
                            <stop offset="100%" stop-color="#7c3aed" />
                        </linearGradient>
                        <linearGradient id="login-left" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3b82f6" />
                            <stop offset="100%" stop-color="#1d4ed8" />
                        </linearGradient>
                        <linearGradient id="login-right" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#8b5cf6" />
                            <stop offset="100%" stop-color="#6d28d9" />
                        </linearGradient>
                        <linearGradient id="login-core" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38bdf8" />
                            <stop offset="100%" stop-color="#c084fc" />
                        </linearGradient>
                    </defs>
                    <path d="M 100,22 L 168,61 L 100,100 L 32,61 Z" fill="url(#login-top)" stroke="#c084fc" stroke-width="2" />
                    <path d="M 32,61 L 100,100 L 100,178 L 32,139 Z" fill="url(#login-left)" stroke="#60a5fa" stroke-width="2" />
                    <path d="M 100,100 L 168,61 L 168,139 L 100,178 Z" fill="url(#login-right)" stroke="#a78bfa" stroke-width="2" />
                    <circle cx="100" cy="100" r="36" fill="#090d16" stroke="url(#login-core)" stroke-width="3" />
                    <circle cx="100" cy="100" r="30" fill="#090d16" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6 3" />
                    <path d="M 82,90 L 100,122 L 118,90" stroke="url(#login-core)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M 92,86 L 108,86" stroke="url(#login-core)" stroke-width="3" stroke-linecap="round" />
                    <path d="M 94,98 L 106,98" stroke="url(#login-core)" stroke-width="3" stroke-linecap="round" />
                    <circle cx="100" cy="108" r="3" fill="#38bdf8" />
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight text-white flex items-center">
                    <span>Exa</span><span class="bg-gradient-to-r from-brand-400 via-purple-300 to-cyan-400 bg-clip-text text-transparent">Vault</span>
                </h1>
                <p class="text-xs text-zinc-400 font-medium">Self-hosted Secret & .env Management</p>
            </div>
        </div>

        <template x-if="error">
            <div class="mb-5 p-3 rounded-lg bg-rose-950/60 border border-rose-800/80 text-rose-300 text-xs flex items-center gap-2">
                <span>⚠️</span>
                <span x-text="error"></span>
            </div>
        </template>

        <form @submit.prevent="login" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-zinc-300 mb-1.5">Username</label>
                <input type="text" x-model="username" required autofocus
                       class="w-full bg-dark-850 border border-dark-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-brand-500 transition-colors"
                       placeholder="Admin username">
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-300 mb-1.5">Password</label>
                <input type="password" x-model="password" required
                       class="w-full bg-dark-850 border border-dark-800 rounded-lg px-3.5 py-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-brand-500 transition-colors"
                       placeholder="••••••••••••">
            </div>

            <button type="submit" :disabled="loading"
                    class="w-full mt-2 bg-brand-500 hover:bg-brand-600 active:bg-brand-700 disabled:opacity-50 text-white font-medium text-sm py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-brand-500/20">
                <span x-show="!loading">Sign In</span>
                <span x-show="loading" class="animate-spin text-base">⏳</span>
            </button>
        </form>

        <div class="mt-8 pt-4 border-t border-dark-800 text-center">
            <p class="text-xs text-zinc-500">AES-256-GCM Encrypted at Rest • Zero Telemetry</p>
        </div>
    </div>
</div>
{% endblock %}
